services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/asaph
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      UPLOADS_DIR: /app/uploads
      # Metadata lookups. Compose reads these from `.env` (not `.env.local`) or
      # the shell; leaving them unset is fine — collections whose provider has no
      # credentials just show no lookup panel. Open Library needs none.
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      METADATA_USER_AGENT: ${METADATA_USER_AGENT:-AsaphJS/0.1}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: asaph
    ports:
      - "5432:5432"
    # Postgres 18+ images expect a mount at /var/lib/postgresql (not .../data) —
    # the entrypoint places versioned data in a subdirectory itself.
    volumes:
      - pgdata_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata_pg18:
  uploads:
