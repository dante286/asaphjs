services:
  app:
    # No build args: the image is origin-agnostic, and passing one would bake a
    # host into the client bundle. See the note in the Dockerfile.
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/asaph
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # Runtime, not build time — the image stays origin-agnostic either way.
      # Optional: without it the app still works (every auth path is a Server
      # Action), but Better Auth warns at boot and /api/auth/* answers 403
      # INVALID_ORIGIN. Compose knows where it publishes, so it may as well say.
      BETTER_AUTH_URL: http://localhost:3000
      UPLOADS_DIR: /app/uploads
      # `false` closes registration. Compose reads this from `.env` (not
      # `.env.local`) or the shell; unset leaves signups open.
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-true}
      # Metadata lookups. Compose reads these from `.env` (not `.env.local`) or
      # the shell; leaving them unset is fine — collections whose provider has no
      # credentials just show no lookup panel. Open Library needs none.
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      METADATA_USER_AGENT: ${METADATA_USER_AGENT:-AsaphJS/0.1}
      # Outgoing mail. Optional, like the lookup keys: without SMTP_HOST and
      # EMAIL_FROM nothing is sent and each message is printed to the container
      # log instead. Not the `mailpit` service below — that's for `npm run dev`
      # on the host, since only a loopback relay may be sent to without TLS.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: asaph
    ports:
      - "5432:5432"
    # Postgres 18+ images expect a mount at /var/lib/postgresql (not .../data) —
    # the entrypoint places versioned data in a subdirectory itself.
    volumes:
      - pgdata_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # A mail catcher for local dev: accepts anything on 1025 and shows it, rendered,
  # at http://localhost:8025. Behind a profile so `docker compose up` never starts
  # it unasked — `docker compose --profile mail up -d mailpit` does. Then set
  # SMTP_HOST=localhost, SMTP_PORT=1025 and any EMAIL_FROM in `.env.local`.
  #
  # Published on loopback only: everything it catches is an invite or reset link.
  mailpit:
    image: axllent/mailpit:v1.31
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  pgdata_pg18:
  uploads:
